<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURELIA Firebase Test</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f8f5;margin:0;padding:24px;color:#173b2a}
.card{max-width:600px;margin:auto;background:#fff;border-radius:18px;padding:24px;box-shadow:0 4px 20px #0001}
button{width:100%;padding:15px;border:0;border-radius:12px;background:#078b4b;color:white;font-size:17px;font-weight:700}
#result{margin-top:18px;padding:15px;border-radius:12px;background:#f1f3f2;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div class="card">
<h2>AURELIA — Tes Firebase</h2>
<p>Untuk mengecek Firebase Authentication dari perangkat ini.</p>
<button id="btn">TES FIREBASE</button>
<div id="result">Belum dites.</div>
</div>
<script>
const API_KEY="AIzaSyAVehPdA3xD_HyG5SVEMnxCtHNVZCgbyc";
const result=document.getElementById("result");
document.getElementById("btn").onclick=async()=>{
 result.textContent="Sedang tes...";
 try{
  const r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key="+encodeURIComponent(API_KEY),{
   method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({returnSecureToken:true})
  });
  const t=await r.text(); let d; try{d=JSON.parse(t)}catch{d={raw:t}}
  result.textContent=r.ok
   ?"AUTH BERHASIL\nHTTP: "+r.status+"\nAnonymous user berhasil dibuat."
   :"AUTH GAGAL\nHTTP: "+r.status+"\n\n"+JSON.stringify(d,null,2);
 }catch(e){result.textContent="REQUEST GAGAL\n\n"+e.name+": "+e.message}
};
</script>
</body>
</html>
