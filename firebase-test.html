<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURELIA — Tes Firebase</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7f6;margin:0;padding:24px}
.card{max-width:520px;margin:40px auto;background:white;padding:24px;border-radius:16px;box-shadow:0 4px 20px #0001}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#0a8f4d;color:#fff;font-weight:700}
pre{white-space:pre-wrap;word-break:break-word;background:#f1f3f3;padding:14px;border-radius:10px}
</style>
</head>
<body>
<div class="card">
<h2>AURELIA — Tes Firebase</h2>
<p>Untuk mengecek Firebase Authentication dari perangkat ini.</p>
<button onclick="testFirebase()">TES FIREBASE</button>
<pre id="result">Belum dites.</pre>
</div>
<script>
const API_KEY = "AIzaSyAVehPdA3xD_HyG5SVEmnxnCtHNVZCgbyc";

async function testFirebase(){
  const el=document.getElementById("result");
  el.textContent="Menguji...";
  try{
    const r=await fetch(
      "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key="+encodeURIComponent(API_KEY),
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({returnSecureToken:true})
      }
    );
    const data=await r.json();
    if(r.ok){
      el.textContent="AUTH BERHASIL\nHTTP: "+r.status+"\n\n"+JSON.stringify(data,null,2);
    }else{
      el.textContent="AUTH GAGAL\nHTTP: "+r.status+"\n\n"+JSON.stringify(data,null,2);
    }
  }catch(e){
    el.textContent="REQUEST GAGAL\n\n"+e.message;
  }
}
</script>
</body>
</html>
